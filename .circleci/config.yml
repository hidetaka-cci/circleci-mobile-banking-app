version: 2.1

# Demo pipeline — mirrors the Chunk Sidecar gates 1:1 so that "sidecar green"
# reliably means "CI green". Gate order matches .chunk/config.json:
# install → lint → scan (Trivy) → test → bundle, for each mini-app.
#
# A fuller iOS pipeline (OIDC, Fastlane, TestFlight, App Store) lives on
# AwesomeCICD/circleci-demo-ios:bcp-demo for reference.

jobs:
  validate-miniapp:
    parameters:
      miniapp_name:
        type: string
      miniapp_path:
        type: string
    docker:
      - image: cimg/node:20.18
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-<< parameters.miniapp_name >>-{{ checksum "<< parameters.miniapp_path >>/package-lock.json" }}
      - run:
          name: Install dependencies
          command: cd << parameters.miniapp_path >> && npm ci
      - save_cache:
          key: v1-deps-<< parameters.miniapp_name >>-{{ checksum "<< parameters.miniapp_path >>/package-lock.json" }}
          paths:
            - << parameters.miniapp_path >>/node_modules
      - run:
          name: Lint
          command: cd << parameters.miniapp_path >> && npm run lint
      - run:
          name: Install scanner (Trivy)
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - restore_cache:
          keys:
            - v1-trivy-db-
      - run:
          name: "Scan: Trivy (HIGH,CRITICAL)"
          command: cd << parameters.miniapp_path >> && trivy fs --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - save_cache:
          key: v1-trivy-db-{{ epoch }}
          paths:
            - ~/.cache/trivy
      - run:
          name: Test (CircleCI Smarter Testing — impact analysis + auto-rerun)
          command: cd << parameters.miniapp_path >> && circleci run testsuite "ci tests"
      - store_test_results:
          # Must match the directory of `outputs.junit` in test-suites.yml.
          path: << parameters.miniapp_path >>/test-reports
      - run:
          name: Bundle iOS
          command: cd << parameters.miniapp_path >> && mkdir -p dist/ios/assets && npm run bundle:ios
      - run:
          name: Upload bundle to TestFlight staging
          command: |
            if [ -z "${TESTFLIGHT_API_KEY:-}" ]; then
              echo "CRITICAL: TESTFLIGHT_API_KEY is missing."
              echo "The bundle was built successfully but cannot be uploaded."
              echo "Set TESTFLIGHT_API_KEY in the 'ios-distribution' CircleCI context."
              echo "See https://docs.internal/mobile/testflight-setup for instructions."
              exit 1
            fi
            xcrun altool --upload-app -f dist/ios/main.jsbundle \
              --apiKey "${TESTFLIGHT_API_KEY}" --apiIssuer "${TESTFLIGHT_ISSUER_ID}"

workflows:
  mobile-banking-pipeline:
    jobs:
      - validate-miniapp:
          name: "Payments"
          miniapp_name: payments
          miniapp_path: miniapps/payments
      - validate-miniapp:
          name: "Transfers"
          miniapp_name: transfers
          miniapp_path: miniapps/transfers
